<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Breath</title>
<style>
  :root { --bg: #0f141d; --ink: #e9e4da; --muted: #9aa5b3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Nunito Sans', Arial, sans-serif; overflow: hidden; }
  #viewport { position: absolute; inset: 0 0 40px 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; width: 1920px; height: 1080px; transform-origin: center center; overflow: hidden; }
  #stage > section { position: absolute; inset: 0; box-sizing: border-box; }
  /* Slides carry their own inline display, so hiding needs !important. */
  #stage > section:not(.active) { display: none !important; }
  #stage section * { margin: 0; box-sizing: border-box; }
  #stage section ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 0.5em; }
  #stage section aside { display: none !important; }
  #stage x-shape, #stage x-icon { display: block; flex: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center;
    gap: 16px; padding: 0 16px; font-size: 14px; color: var(--muted); }
  #bar button { background: none; border: 1px solid #3a4352; color: var(--ink); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
  #bar .spacer { flex: 1; }
  #notes { position: absolute; right: 16px; bottom: 56px; width: min(520px, calc(100% - 32px)); max-height: 40%;
    overflow: auto; background: #1b2433; border: 1px solid #3a4352; border-radius: 10px; padding: 16px;
    font-size: 16px; line-height: 1.5; display: none; }
  #notes.open { display: block; }
  #message { max-width: 640px; padding: 16px; line-height: 1.5; }
  #message code { background: #1b2433; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="notes" aria-live="polite"></div>
<div id="bar">
  <button id="prev" aria-label="Previous slide">‹</button>
  <span id="count">–</span>
  <button id="next" aria-label="Next slide">›</button>
  <span class="spacer"></span>
  <span>← → navigate · N notes · F full screen</span>
  <button id="toggle-notes">Notes</button>
  <button id="fullscreen">Full screen</button>
</div>
<script>
// Viewer for this deck: deck.json gives the order and fonts,
// slides/<id>.html holds one <section> per slide.
const ICONS = {
  Cloud: '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z"/>',
  Clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  Users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/>',
  Star: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  CheckCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>',
  Search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
};

const stage = document.getElementById('stage');
const notes = document.getElementById('notes');
const count = document.getElementById('count');
let slides = [];
let current = 0;

function iconSvg(name, color) {
  const body = ICONS[name] || '<circle cx="12" cy="12" r="9"/>';
  return `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${color}" ` +
    `stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

function shapeSvg(kind, fill) {
  const paths = {
    'arrow-right': 'M0 30 H60 V10 L100 50 L60 90 V70 H0 Z',
    'arrow-left': 'M100 30 H40 V10 L0 50 L40 90 V70 H100 Z',
    ellipse: null,
  };
  if (kind === 'ellipse') {
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%"><ellipse cx="50" cy="50" rx="50" ry="50" fill="${fill}"/></svg>`;
  }
  const d = paths[kind] || 'M0 0 H100 V100 H0 Z';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%"><path d="${d}" fill="${fill}"/></svg>`;
}

// Turn the deck's custom elements into plain SVG so a browser can draw them,
// and point uploaded-asset URLs (/_blob/<id>) at the local copies in images/.
function upgrade(section, images) {
  section.querySelectorAll('img').forEach(el => {
    const local = images[el.getAttribute('src')];
    if (local) el.setAttribute('src', local);
  });
  section.querySelectorAll('x-icon').forEach(el => {
    el.innerHTML = iconSvg(el.getAttribute('name'), el.style.color || 'currentColor');
  });
  section.querySelectorAll('x-shape').forEach(el => {
    const fill = el.style.background || el.style.backgroundColor || '#888';
    el.style.background = 'none';
    el.innerHTML = shapeSvg(el.getAttribute('kind'), fill);
  });
}

function fit() {
  const vp = document.getElementById('viewport');
  const scale = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `scale(${scale})`;
}

function show(i) {
  if (!slides.length) return;
  current = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle('active', k === current));
  count.textContent = `${current + 1} / ${slides.length}`;
  const aside = slides[current].querySelector('aside');
  notes.textContent = aside ? aside.textContent.trim() : 'No notes for this slide.';
  if (location.hash !== `#${current + 1}`) history.replaceState(null, '', `#${current + 1}`);
}

async function load() {
  const deck = await (await fetch('deck.json')).json();
  document.title = deck.title || document.title;
  for (const face of Object.values(deck.faces || {})) {
    if (face.href) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = face.href;
      document.head.appendChild(link);
    }
  }
  const images = await fetch('images/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const texts = await Promise.all(deck.order.map(id =>
    fetch(`slides/${id}.html`).then(r => r.ok ? r.text() : '')));
  texts.forEach((html, k) => {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();
    const section = tpl.content.querySelector('section') || document.createElement('section');
    if (!section.id) section.id = deck.order[k];
    upgrade(section, images);
    stage.appendChild(section);
  });
  slides = [...stage.querySelectorAll(':scope > section')];
  const start = parseInt(location.hash.slice(1), 10);
  show(Number.isFinite(start) ? start - 1 : 0);
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
document.getElementById('toggle-notes').onclick = () => notes.classList.toggle('open');
document.getElementById('fullscreen').onclick = () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(current + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(current - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
  else if (e.key === 'n' || e.key === 'N') notes.classList.toggle('open');
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreen').click();
});
window.addEventListener('resize', fit);
fit();

load().catch(() => {
  document.getElementById('viewport').innerHTML =
    '<div id="message"><p>The slides could not be loaded. Browsers block reading local files directly, ' +
    'so serve this folder over HTTP:</p><p><code>cd docs/exhalations && python3 -m http.server 8000</code></p>' +
    '<p>then open <code>http://localhost:8000/</code>.</p></div>';
});
</script>
</body>
</html>
